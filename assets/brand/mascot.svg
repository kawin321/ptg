<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" fill="none">
  <title>มาสคอตสมุดเลข 3 ร้าน 3 ซ่าเครื่องเขียน</title>
  <defs>
    <linearGradient id="cover" x1="40" y1="33" x2="86" y2="91" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFC9D7"/><stop offset="1" stop-color="#EF8FA9"/>
    </linearGradient>
    <linearGradient id="pencil" x1="86" y1="14" x2="95" y2="71" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE3A0"/><stop offset="1" stop-color="#EAB54B"/>
    </linearGradient>
  </defs>
  <style>
    .za-body { animation: za-bob .8s ease-in-out 6; transform-origin: 60px 72px; }
    .za-foot-left { animation: za-step .8s ease-in-out 6; transform-origin: 47px 90px; }
    .za-foot-right { animation: za-step .8s ease-in-out -.4s 6; transform-origin: 75px 90px; }
    .za-hand { animation: za-wave .8s ease-in-out 6; transform-origin: 88px 67px; }
    .za-spark { animation: za-twinkle 1.6s ease-in-out 3; transform-box: fill-box; transform-origin: center; }
    .za-spark-small { animation-delay: -.8s; }
    @keyframes za-bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-3px) rotate(1deg); } }
    @keyframes za-step { 0%, 100% { transform: rotate(-13deg); } 50% { transform: rotate(14deg); } }
    @keyframes za-wave { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-18deg); } }
    @keyframes za-twinkle { 0%, 100% { opacity: .65; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.12); } }
    @media (prefers-reduced-motion: reduce) { .za-body, .za-foot-left, .za-foot-right, .za-hand, .za-spark { animation: none; } }
  </style>
